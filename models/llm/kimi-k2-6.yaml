model: Kimi-K2.6
label:
  en_US: Kimi-K2.6
  zh_Hans: Kimi-K2.6
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 32768
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 32768
    default: 1024
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "1.0833"
  output: "4.5"
  unit: "0.000001"
  currency: USD
