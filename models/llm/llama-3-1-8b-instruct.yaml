model: llama-3.1-8b-instruct
label:
  en_US: Llama-3.1-8B-Instruct
  zh_Hans: Llama-3.1-8B-Instruct
model_type: llm
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 8192
    default: 1024
  - name: frequency_penalty
    use_template: frequency_penalty
pricing:
  input: "0.1"
  output: "0.1"
  unit: "0.000001"
  currency: USD
