background: "#F3EFFF"
configurate_methods:
  - predefined-model
  - customizable-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
      - models/rerank/rerank.py
    provider_source: provider/ecohash.py
help:
  title:
    en_US: Get your API Key from EcoHash
    zh_Hans: 从 EcoHash 获取 API Key
  url:
    en_US: https://docs.ecohash.com/getting-started/api-keys?utm_source=dify_marketplace&utm_medium=plugin&utm_campaign=ecohash_model_provider
icon_large:
  en_US: icon_large.svg
icon_small:
  en_US: icon_square.svg
label:
  en_US: EcoHash
  zh_Hans: EcoHash
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter the model id, e.g. GLM-5.2
      zh_Hans: 输入模型 ID，例如 GLM-5.2
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your EcoHash API Key (starts with eco_)
        zh_Hans: 输入您的 EcoHash API Key（以 eco_ 开头）
      required: true
      type: secret-input
      variable: api_key
    - default: "8192"
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter the model context size
        zh_Hans: 输入模型上下文长度
      required: true
      type: text-input
      variable: context_size
    - default: "4096"
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      show_on:
        - value: llm
          variable: __model_type
      type: text-input
      variable: max_tokens
    - default: no_call
      label:
        en_US: Function calling
        zh_Hans: 函数调用
      options:
        - label:
            en_US: Not Support
            zh_Hans: 不支持
          value: no_call
        - label:
            en_US: Support
            zh_Hans: 支持
          value: function_call
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
      variable: function_calling_type
provider: ecohash
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your EcoHash API Key (starts with eco_)
        zh_Hans: 输入您的 EcoHash API Key（以 eco_ 开头）
      required: true
      type: secret-input
      variable: api_key
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
  rerank:
    position: models/rerank/_position.yaml
    predefined:
      - models/rerank/*.yaml
supported_model_types:
  - llm
  - text-embedding
  - rerank
